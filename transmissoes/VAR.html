<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACTV - Arena Competidor VAR Studio</title>
    <!-- Fontes Estilo Studio/Técnicas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Ícones Profissionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #09090b;
            --bg-panel: #18181b;
            --bg-control: #27272a;
            --border-color: #3f3f46;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --text-muted: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* CABEÇALHO PROFISSIONAL DE ESTÚDIO (BROADCAST HEADER) */
        header {
            background-color: var(--bg-main);
            border-bottom: 2px solid var(--border-color);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Estilo da Logo ACTV */
        .logo-container {
            display: flex;
            align-items: center;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
            height: 45px;
        }

        .studio-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.2));
        }

        .system-branding {
            display: flex;
            flex-direction: column;
        }

        .system-branding h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-branding h1 span {
            color: var(--accent-red);
        }

        .system-branding .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* Monitor de Status do Estúdio (Centro) */
        .header-center-dashboard {
            display: flex;
            align-items: center;
            gap: 24px;
            background-color: var(--bg-panel);
            padding: 8px 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
        }

        .blink-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .timecode {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-status {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CONTAINER PRINCIPAL */
        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 75px);
            overflow: hidden;
        }

        /* TELA DE FOCO (ESQUERDA) */
        .video-focus-section {
            flex: 2.8;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--bg-panel);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .active-area-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .active-area-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .active-area-title i {
            color: var(--accent-red);
        }

        .feed-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .main-video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Proporção 16:9 */
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .main-video-wrapper iframe, .main-video-wrapper div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* PAINEL DE CONTROLES DO VAR (ESTILO CONSOLE FÍSICO) */
        .var-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background-color: var(--bg-main);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .control-group-title {
            grid-column: span 3;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: -4px;
        }

        .btn {
            background-color: var(--bg-panel);
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-grow: 1;
        }

        .btn:hover {
            background-color: var(--border-color);
            border-color: #71717a;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-live {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .btn-live:hover {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        .btn-play {
            background-color: #27272a;
            border-color: var(--accent-red);
        }

        /* LATERAL DIREITA (GRID DE MINIATURAS) */
        .thumbnails-sidebar {
            flex: 1.4;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 12px;
            overflow-y: auto;
            padding-right: 8px;
        }

        /* Custom Scrollbar */
        .thumbnails-sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .thumbnails-sidebar::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        .thumb-box {
            background-color: var(--bg-panel);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .thumb-box:hover {
            border-color: #71717a;
            transform: translateY(-2px);
        }

        .thumb-box.active {
            border-color: var(--accent-red);
            background-color: rgba(239, 68, 68, 0.05);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
        }

        .thumb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .thumb-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .thumb-box.active .thumb-title {
            color: var(--accent-red);
        }

        .thumb-status {
            font-size: 0.6rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .thumb-video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
            pointer-events: none; /* Previne interação direta */
            border: 1px solid rgba(255,255,255,0.05);
        }

        .thumb-video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- Estúdio Broadcast Header -->
    <header>
        <div class="header-left">
            <div class="logo-container">
                <!-- Imagem da logo principal do cliente -->
                <img src="ACTV.png" alt="ACTV" class="studio-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <span id="logo-fallback" style="display:none; font-weight:900; font-size:1.5rem; color:var(--accent-red); letter-spacing:1px;">AC TV</span>
            </div>
            <div class="system-branding">
                <h1>Arena Competidor <span>VAR</span></h1>
                <div class="subtitle">Broadcast Control Suite</div>
            </div>
        </div>

        <!-- Dashboard Central de Broadcast -->
        <div class="header-center-dashboard">
            <div class="status-indicator">
                <span class="blink-dot"></span>
                <span>REC ON AIR</span>
            </div>
            <div class="timecode" id="studio-timecode">14:24:36:00</div>
        </div>

        <div class="header-right">
            <div class="badge-status"><i class="fa-solid fa-signal" style="margin-right: 5px;"></i> SYSTEM OK</div>
        </div>
    </header>

    <!-- Área de Conteúdo do Estúdio -->
    <div class="main-container">
        
        <!-- Bloco Principal Monitor & Consoles -->
        <div class="video-focus-section">
            <div class="active-area-title-bar">
                <div class="active-area-title" id="main-title">
                    <i class="fa-solid fa-circle-play"></i> ÁREA 1 - MONITOR PRINCIPAL
                </div>
                <div class="feed-indicator">SINAL: 1080p @ 60FPS</div>
            </div>
            
            <div class="main-video-wrapper">
                <div id="main-player"></div>
            </div>

            <!-- Console Físico de Comando (Grid VAR) -->
            <div class="var-controls">
                
                <!-- Grupo de Navegação Temporal Rápida -->
                <div class="control-group">
                    <button class="btn" onclick="seek(-30)" title="Voltar 30 Segundos"><i class="fa-solid fa-backward-fast"></i> -30s</button>
                    <button class="btn" onclick="seek(-10)" title="Voltar 10 Segundos"><i class="fa-solid fa-backward"></i> -10s</button>
                    <button class="btn" onclick="seek(-5)" title="Voltar 5 Segundos"><i class="fa-solid fa-caret-left"></i> -5s</button>
                </div>

                <!-- Grupo de Navegação Frame-by-Frame & Playback principal -->
                <div class="control-group">
                    <button class="btn" onclick="seek(-1)" title="Retroceder 1 Segundo"><i class="fa-solid fa-chevron-left"></i> -1s</button>
                    <button class="btn btn-play" onclick="playPause()" title="Iniciar/Pausar Reprodução"><i class="fa-solid fa-play"></i> / <i class="fa-solid fa-pause"></i> PLAY/PAUSE</button>
                    <button class="btn" onclick="seek(1)" title="Avançar 1 Segundo">+1s <i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- Grupo de Avanço Rápido -->
                <div class="control-group">
                    <button class="btn" onclick="seek(5)" title="Avançar 5 Segundos">+5s <i class="fa-solid fa-caret-right"></i></button>
                    <button class="btn" onclick="seek(10)" title="Avançar 10 Segundos">+10s <i class="fa-solid fa-forward"></i></button>
                    <button class="btn btn-live" onclick="goLive()" title="Sincronizar com o feed Ao Vivo"><i class="fa-solid fa-circle-dot"></i> AO VIVO</button>
                </div>

                <!-- Painel de Velocidade de Câmera Lenta -->
                <div class="control-group-title">Seleção de Velocidade de Playback (Câmera Lenta)</div>
                <div class="control-group" style="grid-column: span 3; width: 100%;">
                    <button class="btn" onclick="changeSpeed(0.25)"><i class="fa-solid fa-gauge-simple-high"></i> 0.25x Super Slow</button>
                    <button class="btn" onclick="changeSpeed(0.5)"><i class="fa-solid fa-gauge-simple"></i> 0.50x Slow</button>
                    <button class="btn" onclick="changeSpeed(0.75)"><i class="fa-solid fa-gauge"></i> 0.75x Moderado</button>
                    <button class="btn" style="background-color: #27272a;" onclick="changeSpeed(1)"><i class="fa-solid fa-gauge-high"></i> 1.00x Normal</button>
                </div>
            </div>
        </div>

        <!-- Grade de Multi-Telas das 12 Áreas -->
        <div class="thumbnails-sidebar" id="sidebar-thumbs">
            <!-- Gerado via Javascript dinamicamente -->
        </div>

    </div>

    <!-- Scripts de Controle e Integração do Vídeo -->
    <script>
        // Mapeamento dos IDs das 12 transmissões fornecidas
        const videoSources = {
            1: '1l7ZVoQU8Fk', 
            2: 'yRu6zcKE4V4',
            3: 'YYd28w0_bNQ',
            4: 'vu5MKz5I8FM',
            5: 'mF0sxQa6YoA',
            6: 'draa7ETXRvM',
            7: 'w72Go2hZVCU',
            8: 'SFMRyHC-kvA',
            9: 'ntgyPNI6Lgc',
            10: 'OLTY5vU6gGg',
            11: 'fEoIEqFzSEs',
            12: 'IkhUOslt4lQ'
        };

        let mainPlayer;
        let currentArea = 1;

        // Injeta assincronamente a API do Player de Iframe do YouTube
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Disparado assim que a API é totalmente carregada
        function onYouTubeIframeAPIReady() {
            mainPlayer = new YT.Player('main-player', {
                videoId: videoSources[currentArea],
                playerVars: {
                    'autoplay': 1,
                    'controls': 0, // Desativa controles do YouTube para dar visual limpo de monitor profissional
                    'rel': 0,
                    'modestbranding': 1,
                    'mute': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });

            renderThumbnails();
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        // Renderização dos 12 Feeds de Luta Laterais
        function renderThumbnails() {
            const sidebar = document.getElementById('sidebar-thumbs');
            sidebar.innerHTML = '';

            for (let i = 1; i <= 12; i++) {
                const activeClass = i === currentArea ? 'active' : '';
                
                const thumbBox = document.createElement('div');
                thumbBox.className = `thumb-box ${activeClass}`;
                thumbBox.setAttribute('onclick', `switchMainVideo(${i})`);
                thumbBox.id = `thumb-area-${i}`;

                thumbBox.innerHTML = `
                    <div class="thumb-header">
                        <div class="thumb-title">Área ${i}</div>
                        <div class="thumb-status"><i class="fa-solid fa-circle" style="font-size: 6px;"></i> ONLINE</div>
                    </div>
                    <div class="thumb-video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${videoSources[i]}?controls=0&mute=1&autoplay=1&playlist=${videoSources[i]}&loop=1" frameborder="0"></iframe>
                    </div>
                `;
                sidebar.appendChild(thumbBox);
            }
        }

        // Troca o monitor principal
        function switchMainVideo(areaNumber) {
            if (areaNumber === currentArea) return;

            document.getElementById(`thumb-area-${currentArea}`).classList.remove('active');
            document.getElementById(`thumb-area-${areaNumber}`).classList.add('active');

            currentArea = areaNumber;
            document.getElementById('main-title').innerHTML = `<i class="fa-solid fa-circle-play"></i> ÁREA ${currentArea} - MONITOR PRINCIPAL`;

            // Carrega novo feed no console
            mainPlayer.loadVideoById({videoId: videoSources[currentArea]});
        }

        /* COMANDOS DE ARBITRAGEM DO DECK */
        function playPause() {
            const state = mainPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                mainPlayer.pauseVideo();
            } else {
                mainPlayer.playVideo();
            }
        }

        function seek(seconds) {
            const currentTime = mainPlayer.getCurrentTime();
            mainPlayer.seekTo(currentTime + seconds, true);
        }

        function changeSpeed(rate) {
            mainPlayer.setPlaybackRate(rate);
        }

        function goLive() {
            mainPlayer.setPlaybackRate(1);
            const duration = mainPlayer.getDuration();
            mainPlayer.seekTo(duration, true);
            mainPlayer.playVideo();
        }

        // Relógio de Produção Digital (Timecode de estúdio)
        function updateTimecode() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const frames = String(Math.floor(now.getMilliseconds() / 40)).padStart(2, '0'); // Simula 25fps aproximados
            
            document.getElementById('studio-timecode').innerText = `${hours}:${minutes}:${seconds}:${frames}`;
        }
        setInterval(updateTimecode, 40);
    </script>
</body>
</html>
