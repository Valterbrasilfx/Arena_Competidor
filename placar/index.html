<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FightScore Pro - Nova luta</title><link rel="stylesheet" href="css/app.css"></head><body><main class="app-shell"><section class="panel"><div class="header"><h1>FightScore Pro · Configurar luta</h1><span class="small">Configuração da luta</span></div><form id="fightForm"><div class="grid2"><section class="player-card"><h2>Atleta azul</h2><div class="field"><label for="a1">Nome</label><input id="a1" required maxlength="70" placeholder="Nome do atleta azul"></div><div class="field"><label for="team1">Equipe</label><input id="team1" maxlength="70" placeholder="Equipe"></div><div class="field"><label for="reg1">Inscrição</label><input id="reg1" maxlength="30" placeholder="Número de inscrição"></div></section><section class="player-card white"><h2>Atleta branco</h2><div class="field"><label for="a2">Nome</label><input id="a2" required maxlength="70" placeholder="Nome do atleta branco"></div><div class="field"><label for="team2">Equipe</label><input id="team2" maxlength="70" placeholder="Equipe"></div><div class="field"><label for="reg2">Inscrição</label><input id="reg2" maxlength="30" placeholder="Número de inscrição"></div></section></div><div class="grid2"><div class="field"><label for="minutes">Tempo (minutos)</label><input id="minutes" type="number" min="1" max="60" value="5" required></div><div class="field"><label for="category">Categoria</label><input id="category" maxlength="100" placeholder="Ex.: Adulto, faixa preta, leve"></div></div><div class="toolbar"><button class="success" type="submit">Salvar e abrir operador</button><button class="muted" type="button" id="swap">Trocar atletas</button><button class="muted" type="button" id="resume">Carregar luta atual</button></div><p class="small">Modo online: depois de configurar o Supabase em js/config.js, as telas e o OBS poderão sincronizar pela internet. O código desta sala será criado automaticamente.</p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/scoreboard.js"></script><script>
const $=id=>document.getElementById(id);const state=FightScore.read();
function fill(){ $('a1').value=state.atleta1.nome||'';$('team1').value=state.atleta1.equipe||'';$('reg1').value=state.atleta1.inscricao||'';$('a2').value=state.atleta2.nome||'';$('team2').value=state.atleta2.equipe||'';$('reg2').value=state.atleta2.inscricao||'';$('minutes').value=Math.round(state.tempoTotalSegundos/60)||5;$('category').value=state.categoria||''; }
if(localStorage.getItem(FightScore.STORAGE_KEY))fill();
$('swap').onclick=()=>{for(const pair of [['a1','a2'],['team1','team2'],['reg1','reg2']]){const x=$(pair[0]).value;$(pair[0]).value=$(pair[1]).value;$(pair[1]).value=x;}};
$('resume').onclick=()=>location.href=FightScore.getRoomUrl('placar_operador.html');
$('fightForm').onsubmit=e=>{e.preventDefault();const mins=Number($('minutes').value);if(!Number.isInteger(mins)||mins<1||mins>60){alert('Informe um tempo entre 1 e 60 minutos.');return;}const s=FightScore.defaultState();s.atleta1={...s.atleta1,nome:$('a1').value.trim(),equipe:$('team1').value.trim(),inscricao:$('reg1').value.trim()};s.atleta2={...s.atleta2,nome:$('a2').value.trim(),equipe:$('team2').value.trim(),inscricao:$('reg2').value.trim()};s.categoria=$('category').value.trim();s.tempoTotalSegundos=mins*60;s.tempoRestanteSegundos=mins*60;FightScore.publish(s);location.href=FightScore.getRoomUrl('placar_operador.html');};
</script></body></html>
