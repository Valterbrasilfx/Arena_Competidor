<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FightScore Pro - Overlay OBS</title><style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Oswald,Arial,sans-serif;text-transform:uppercase}.stage{position:absolute;left:0;right:0;bottom:5vh;display:flex;flex-direction:column;align-items:center;padding:0 2vw}.bar{width:100%;max-width:1600px;height:78px;display:grid;grid-template-columns:1fr 150px 1fr;filter:drop-shadow(0 4px 8px #0009)}.side{display:flex;align-items:center;min-width:0;padding:0 12px;gap:10px}.left{background:linear-gradient(90deg,#970000,#e20b0b);border-radius:5px 0 0 5px;justify-content:space-between}.right{background:linear-gradient(90deg,#0756c4,#00327d);border-radius:0 5px 5px 0;justify-content:space-between}.player{min-width:0;display:flex;flex-direction:column;overflow:hidden}.left .player{text-align:left}.right .player{text-align:right}.name{font-size:clamp(15px,2vw,30px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}.team{font-size:clamp(10px,1vw,15px);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-group{display:flex;align-items:center;gap:5px;flex-shrink:0}.score{width:58px;height:64px;border-radius:4px;background:#0004;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;line-height:1}.sub{display:flex;flex-direction:column;gap:3px}.bubble{width:22px;height:22px;border:1px solid #fff9;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}.adv{background:#219653}.pen{background:#bd2828}.clock{background:#101010;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;position:relative}.clock:before{content:'TEMPO';position:absolute;top:2px;font-size:9px;letter-spacing:2px;color:#aaa}.category{background:#000;padding:3px 22px;min-width:300px;text-align:center;font-size:17px;letter-spacing:1px;border-radius:0 0 7px 7px;box-shadow:0 3px 7px #0008}.winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000b;text-align:center}.winner.show{display:flex}.winner h1{font-size:7vh;color:#ffd900;margin:0}.winner strong{font-size:9vh}.winner span{font-size:4vh;color:#2ecc71}@media(max-width:800px){.bar{height:58px;grid-template-columns:1fr 95px 1fr}.score{width:42px;height:48px;font-size:34px}.clock{font-size:27px}.bubble{width:17px;height:17px;font-size:10px}.side{padding:0 5px;gap:4px}.category{font-size:12px;min-width:200px}}
</style></head><body><main class="stage"><section class="bar"><div class="side left"><div class="player"><div class="name" id="name1">ATLETA AZUL</div><div class="team" id="team1"></div></div><div class="score-group"><div class="sub"><div class="bubble adv" id="adv1">0</div><div class="bubble pen" id="pen1">0</div></div><div class="score" id="points1">0</div></div></div><div class="clock" id="timer">00:00</div><div class="side right"><div class="score-group"><div class="score" id="points2">0</div><div class="sub"><div class="bubble adv" id="adv2">0</div><div class="bubble pen" id="pen2">0</div></div></div><div class="player"><div class="name" id="name2">ATLETA BRANCO</div><div class="team" id="team2"></div></div></div></section><div class="category" id="category">CATEGORIA</div></main><section class="winner" id="winner"><h1>VENCEDOR</h1><strong id="winnerName"></strong><div id="winnerTeam"></div><span id="method"></span></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/scoreboard.js"></script><script>
const $=id=>document.getElementById(id);function render(s){$('name1').textContent=s.atleta1.nome||'ATLETA AZUL';$('team1').textContent=s.atleta1.equipe||'';$('points1').textContent=s.atleta1.pontos;$('adv1').textContent=s.atleta1.vantagens;$('pen1').textContent=s.atleta1.punicoes;$('name2').textContent=s.atleta2.nome||'ATLETA BRANCO';$('team2').textContent=s.atleta2.equipe||'';$('points2').textContent=s.atleta2.pontos;$('adv2').textContent=s.atleta2.vantagens;$('pen2').textContent=s.atleta2.punicoes;$('timer').textContent=FightScore.formatTime(FightScore.remaining(s));$('category').textContent=s.categoria||'CATEGORIA NÃO INFORMADA';const done=s.lutaFinalizada&&s.nomeVencedor;$('winner').classList.toggle('show',!!done);$('winnerName').textContent=done?s.nomeVencedor:'';$('winnerTeam').textContent=done?(s.equipeVencedor||''):'';$('method').textContent=done?(s.comoTerminou||''):'';}
FightScore.subscribe(render);FightScore.initRealtime('viewer');setInterval(()=>{const s=FightScore.read();$('timer').textContent=FightScore.formatTime(FightScore.remaining(s));},200);
</script></body></html>
