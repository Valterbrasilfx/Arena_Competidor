<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Web App</title>
    <style>
        /* Reset de margens e definição do tema escuro */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden; /* Evita rolagem na TV */
        }

        /* Container Principal */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 40px;
        }

        /* Container do Logo */
        .logo-container {
            text-align: center;
        }

        .logo {
            max-height: 70px;
            width: auto;
            object-fit: contain;
        }

        /* Container dos Botões - Alinhamento Vertical */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* Estilização dos Botões */
        .tv-button {
            background-color: #cc0000;
            color: #ffffff;
            border: 4px solid transparent;
            padding: 22px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
            outline: none;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estado de Hover e Focus */
        .tv-button:focus, .tv-button:hover {
            background-color: #ff1a1a;
            border-color: #ffffff;
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 26, 26, 0.8);
        }

        /* Botão do Patrocinador com leve variação */
        .btn-patrocinador {
            background-color: #990000;
        }
        
        .btn-patrocinador:focus, .btn-patrocinador:hover {
            background-color: #e60000;
        }

        /* --- Seção de Propaganda do Arena Competidor --- */
        .promo-container {
            background: linear-gradient(180deg, #111111 0%, #080808 100%);
            border: 2px solid #222222;
            border-radius: 16px;
            padding: 25px 40px;
            width: 90%;
            max-width: 1100px;
            text-align: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        .promo-title {
            color: #ff1a1a;
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .promo-grid {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .promo-item {
            flex: 1;
            min-width: 130px;
            background-color: #1a1a1a;
            padding: 15px 10px;
            border-radius: 8px;
            border-bottom: 3px solid #cc0000;
        }

        .promo-item h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .promo-item p {
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        .promo-highlight {
            color: #ff1a1a !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo do App -->
        <div class="logo-container">
            <img src="arena2.png" alt="Arena Logo" class="logo">
        </div>

        <!-- Botões de Ação (Um abaixo do outro) -->
        <div class="button-container">
            <button class="tv-button" onclick="irParaTimerPadrao()">Placar Normal</button>
            <button class="tv-button btn-patrocinador" onclick="irParaTimerPatrocinador()">Placar com Patrocínio</button>
        </div>
    </div>

    <!-- Banner de Propaganda da Arena Competidor -->
    <div class="promo-container">
        <h3 class="promo-title">Serviços arenacompetidor.com</h3>
        <div class="promo-grid">
            <div class="promo-item">
                <h4>Inscrições</h4>
                <p>Gestão Online</p>
            </div>
            <div class="promo-item">
                <h4>Sistemas</h4>
                <p>Chaves e Lutas</p>
            </div>
            <div class="promo-item">
                <h4>Transmissões</h4>
                <p>Ao Vivo Profissional</p>
            </div>
            <div class="promo-item">
                <h4>VAR</h4>
                <p>Análise de Vídeo</p>
            </div>
            <div class="promo-item">
                <h4>Placares</h4>
                <p>Tempo Real</p>
            </div>
            <div class="promo-item">
                <h4 class="promo-highlight">Jiu-Jitsu</h4>
                <p>Geral</p>
            </div>
        </div>
    </div>

    <script>
        // Foco inicial e navegação vertical para TV
        window.addEventListener('DOMContentLoaded', () => {
            const botoes = document.querySelectorAll('.tv-button');
            if (botoes.length > 0) {
                botoes[0].focus();
            }

            let indiceFoco = 0;
            document.addEventListener('keydown', (e) => {
                // Navegação por setas para CIMA e para BAIXO do controle remoto
                if (e.key === 'ArrowDown') {
                    indiceFoco = (indiceFoco + 1) % botoes.length;
                    botoes[indiceFoco].focus();
                    e.preventDefault();
                } else if (e.key === 'ArrowUp') {
                    indiceFoco = (indiceFoco - 1 + botoes.length) % botoes.length;
                    botoes[indiceFoco].focus();
                    e.preventDefault();
                }
            });
        });

        // Ações de redirecionamento real dos Botões
        function irParaTimerPadrao() {
            window.location.href = 'timer2.html';
        }

        function irParaTimerPatrocinador() {
            window.location.href = 'patrocinador.html';
        }
    </script>
</body>
</html>
