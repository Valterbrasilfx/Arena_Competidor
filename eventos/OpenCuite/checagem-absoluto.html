<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checagem Absoluto | Arena Competidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb; 
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%; text-align: center; padding: 15px 0;
            background-color: #000; position: fixed; top: 0; z-index: 1000;
        }
        header img { max-width: 250px; width: 80%; height: auto; }

        .main-content {
            margin-top: 140px;
            width: 95%;
            max-width: 1000px;
            padding-bottom: 60px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            color: #111827;
            font-weight: 700; font-size: 2rem;
            text-align: center; margin-bottom: 30px;
        }

        .filtros-container {
            background: var(--card-bg); padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow-md); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; margin-bottom: 30px;
        }

        .filtro-grupo { display: flex; flex-direction: column; gap: 6px; }
        .filtro-grupo label { font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        .filtro-grupo select { padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb; background-color: #f9fafb; cursor: pointer; font-family: 'Inter', sans-serif; }

        .faixa-group-header {
            background-color: #111827;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 35px 0 15px 0;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .faixa-group-header::before {
            content: ''; width: 4px; height: 18px; background: var(--primary-color); border-radius: 2px;
        }

        .accordion-item {
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .accordion-header {
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            background: #fff;
        }

        .accordion-header::after { content: '▼'; font-size: 0.7rem; color: var(--text-secondary); }
        .accordion-header.active::after { content: '▲'; }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #fff;
        }

        .accordion-content.open {
            max-height: 3000px;
            padding: 0 25px 25px;
            border-top: 1px solid #f3f4f6;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { 
            text-align: left; padding: 12px; 
            font-size: 0.7rem; color: var(--text-secondary); 
            text-transform: uppercase; border-bottom: 2px solid #f3f4f6; 
        }
        td { padding: 12px; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; vertical-align: middle; }

        .ord-badge {
            background: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.75rem;
            color: #374151;
        }

        /* BADGE DE STATUS CONFIRMADO */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-confirmado {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .link-voltar {
            display: block; width: fit-content; margin: 40px auto;
            padding: 14px 30px; background-color: #111827; color: #fff;
            text-decoration: none; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-weight: 600;
        }

        #loading-message { 
            text-align: center; 
            padding: 30px; 
            font-weight: 600; 
            color: var(--primary-color); 
            background: #fff;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        @media (max-width: 768px) {
            thead { display: none; }
            tr { display: block; padding: 10px 0; border-bottom: 1px solid #eee; }
            td { display: flex; justify-content: space-between; padding: 5px 0; text-align: right; }
            td::before { content: attr(data-label); font-weight: 700; color: var(--text-secondary); float: left; margin-right: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html"><img src="../../img/arena2.png" alt="Arena Competidor Logo"></a>
    </header>

    <div class="main-content">
        <h1>Checagem de Absoluto (Confirmados)</h1>

        <div class="filtros-container">
            <div class="filtro-grupo"><label>Gênero</label><select id="filtroGenero"><option value="todos">Todos</option></select></div>
            <div class="filtro-grupo"><label>Faixa</label><select id="filtroFaixa"><option value="todos">Todos</option></select></div>
        </div>

        <div id="loading-message">Carregando inscritos confirmados do Absoluto...</div>
        <div id="listaInscritosAbsoluto"></div>
        <a href="checagem.html" class="link-voltar">Voltar para Opções</a>
    </div>

    <script>
        const CSV_URL = 'https://script.google.com/macros/s/AKfycbzkGn8NFSDi_X5ituL-tMZm7-UCRNMxfMKzjTXDcQ698dNRMiHDNdvFJx1PE_d-lUTV/exec';
        const ORDEM_FAIXAS = { 'PRETA': 1, 'MARROM': 2, 'ROXA': 3, 'AZUL': 4, 'BRANCA': 5 };
        
        // Índice da coluna R (18ª coluna = índice 17)
        const INDEX_COLUNA_R = 17;

        let dadosAtletasAbsoluto = [];

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function obterBadgeStatus() {
            return `<span class="status-badge status-confirmado">CONFIRMADO</span>`;
        }

        async function fetchAndProcessData() {
            const loadingEl = document.getElementById('loading-message');
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error(`Erro na rede (${response.status}): ${response.statusText}`);

                const csvText = await response.text();
                if (!csvText || csvText.trim() === '') throw new Error('A planilha retornou dados vazios.');

                const lines = csvText.split('\n').filter(l => l.trim() !== '');
                if (lines.length < 2) throw new Error('Nenhum dado encontrado na planilha.');

                const headers = lines[0].split(',').map(h => h.toUpperCase().trim().replace(/"/g, ''));
                
                const findCol = (...keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));

                const idx = {
                    ord: findCol('ORD'),
                    nome: findCol('NOME'),
                    equipe: findCol('EQUIPE'),
                    professor: findCol('PROFESSOR'),
                    faixa: findCol('FAIXA'),
                    cat: findCol('CATEGORIA'),
                    sexo: findCol('SEXO'),
                    abs: findCol('ABSOLUTO')
                };

                dadosAtletasAbsoluto = lines.slice(1).map(linha => {
                    const colunas = parseCSVLine(linha);
                    const getVal = (colIdx) => colIdx !== -1 && colunas[colIdx] ? colunas[colIdx].replace(/"/g, '').trim() : '';

                    const statusR = colunas[INDEX_COLUNA_R]?.replace(/"/g, '').trim() || '';

                    return {
                        ord: getVal(idx.ord) || '-',
                        nome: getVal(idx.nome),
                        equipe: getVal(idx.equipe),
                        professor: getVal(idx.professor) || 'Não informado',
                        faixa: getVal(idx.faixa).toUpperCase() || 'BRANCA',
                        categoria: getVal(idx.cat),
                        sexo: getVal(idx.sexo).toUpperCase(),
                        absoluto: getVal(idx.abs).toUpperCase(),
                        statusR: statusR
                    };
                }).filter(atleta => {
                    const pediuAbsoluto = atleta.absoluto.includes('SIM') || atleta.absoluto === 'S';
                    const estaConfirmado = atleta.statusR.toUpperCase().includes('CONFIRMADO');
                    
                    // Mantém apenas inscritos do Absoluto com Status CONFIRMADO na Coluna R
                    return pediuAbsoluto && estaConfirmado;
                });

                loadingEl.style.display = 'none';
                renderizar(true);
            } catch (error) {
                console.error('Erro ao processar:', error);
                loadingEl.style.color = '#dc2626';
                loadingEl.innerHTML = `❌ <strong>Erro ao carregar dados:</strong><br>${error.message}`;
            }
        }

        function atualizarOpcoesDosFiltros(filtrados) {
            const selects = {
                'filtroGenero': 'sexo',
                'filtroFaixa': 'faixa'
            };

            Object.keys(selects).forEach(id => {
                const campo = selects[id];
                const select = document.getElementById(id);
                if (!select) return;

                const valorAtual = select.value;
                
                const optSet = new Set();
                filtrados.forEach(a => { if(a[campo]) optSet.add(a[campo]) });

                const arr = Array.from(optSet).sort();
                if(id === 'filtroFaixa') arr.sort((a,b) => (ORDEM_FAIXAS[a.toUpperCase()]||99) - (ORDEM_FAIXAS[b.toUpperCase()]||99));

                select.innerHTML = '<option value="todos">Todos</option>';
                arr.forEach(optValue => {
                    const el = document.createElement('option');
                    el.value = optValue;
                    el.textContent = optValue;
                    if(optValue === valorAtual) el.selected = true;
                    select.appendChild(el);
                });
            });
        }

        function renderizar(atualizarFiltros = false) {
            const container = document.getElementById('listaInscritosAbsoluto');
            const fG = document.getElementById('filtroGenero').value;
            const fF = document.getElementById('filtroFaixa').value;

            const filtrados = dadosAtletasAbsoluto.filter(a => 
                (fG === 'todos' || a.sexo === fG) &&
                (fF === 'todos' || a.faixa === fF)
            );

            if(atualizarFiltros) {
                atualizarOpcoesDosFiltros(filtrados.length > 0 || (fG==='todos' && fF==='todos') ? (filtrados.length > 0 ? filtrados : dadosAtletasAbsoluto) : dadosAtletasAbsoluto);
            }

            container.innerHTML = '';

            if (filtrados.length === 0) {
                container.innerHTML = '<p style="text-align:center; font-weight:600; color:#6b7280; margin-top:20px;">Nenhum atleta confirmado encontrado para os filtros selecionados.</p>';
                return;
            }

            const estrutura = {};
            filtrados.forEach(atleta => {
                let catName = atleta.categoria || 'GERAL';
                if (catName.toUpperCase().includes('MASTER')) catName = 'MASTER (TODAS AS IDADES)';
                
                const chave = `ABSOLUTO ${catName.toUpperCase()} (${atleta.sexo || 'N/A'})`;
                
                if (!estrutura[atleta.faixa]) estrutura[atleta.faixa] = {};
                if (!estrutura[atleta.faixa][chave]) estrutura[atleta.faixa][chave] = [];
                estrutura[atleta.faixa][chave].push(atleta);
            });

            Object.keys(estrutura).sort((a, b) => (ORDEM_FAIXAS[a] || 99) - (ORDEM_FAIXAS[b] || 99))
            .forEach(faixa => {
                const headerFaixa = document.createElement('div');
                headerFaixa.className = 'faixa-group-header';
                headerFaixa.textContent = `Faixa ${faixa}`;
                container.appendChild(headerFaixa);

                const chaves = estrutura[faixa];
                Object.keys(chaves).sort().forEach(chaveNome => {
                    const atletas = chaves[chaveNome];
                    const item = document.createElement('div');
                    item.className = 'accordion-item';
                    item.innerHTML = `
                        <div class="accordion-header" onclick="toggleAcc(this)">
                            ${chaveNome} (${atletas.length})
                        </div>
                        <div class="accordion-content">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ORD</th>
                                        <th>Atleta</th>
                                        <th>Equipe</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${atletas.map(a => `
                                        <tr>
                                            <td data-label="ORD"><span class="ord-badge">${a.ord}</span></td>
                                            <td data-label="Atleta">${a.nome}</td>
                                            <td data-label="Equipe">${a.equipe}</td>
                                            <td data-label="Status">${obterBadgeStatus()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(item);
                });
            });
        }

        function toggleAcc(el) {
            el.classList.toggle('active');
            el.nextElementSibling.classList.toggle('open');
        }

        document.querySelectorAll('select').forEach(s => {
            s.addEventListener('change', () => {
                renderizar(true);
            });
        });

        fetchAndProcessData();
    </script>
</body>
</html>
