<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FightScore Pro - TV</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}.screen{height:100vh;display:flex;flex-direction:column}.timer-wrap{height:25vh;display:flex;align-items:center;justify-content:center;background:#000;flex-shrink:0}.timer{font-size:22vh;font-weight:900;line-height:1}.fighter{height:37.5vh;display:flex;align-items:center;justify-content:space-between;padding:2vh 3vw;overflow:hidden}.blue{background:#001f78}.white{background:#fff;color:#000}.info{min-width:0;max-width:58%;overflow:hidden}.name{font-size:8vh;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{font-size:3vh;margin-top:1vh;text-transform:uppercase}.scores{display:flex;align-items:center;gap:1vw}.main-score{background:#ffd900;color:#000;border-radius:2vh;min-width:26vh;height:26vh;display:flex;align-items:center;justify-content:center;font-size:19vh;font-weight:900;padding:1vh 2vw}.subs{display:flex;flex-direction:column;gap:1vh}.sub{min-width:12vh;padding:1vh;border-radius:1vh;text-align:center;color:#fff;font-weight:900;font-size:2vh}.sub b{display:block;font-size:7vh}.adv{background:#28a745}.pen{background:#dc3545}.footer{position:absolute;bottom:1vh;left:0;width:100%;text-align:center;color:#ffffff66;font-size:1.5vh}.winner{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4vw}.winner.show{display:flex}.winner h1{font-size:10vh;color:#ffd900;margin:0 0 3vh}.winner .wname{font-size:12vh;font-weight:900}.winner .wteam{font-size:5vh;color:#ddd;margin:2vh}.winner .method{font-size:5vh;color:#2ecc71;margin-top:2vh}@media(max-aspect-ratio:1/1){.name{font-size:6vw}.main-score{min-width:22vw;height:22vw;font-size:16vw}.timer{font-size:18vw}}
</style></head><body><main class="screen"><div class="timer-wrap"><div class="timer" id="timer">00:00</div></div><section class="fighter blue"><div class="info"><div class="name" id="name1">ATLETA AZUL</div><div class="team" id="team1"></div></div><div class="scores"><div class="main-score" id="points1">0</div><div class="subs"><div class="sub adv">VANT.<b id="adv1">0</b></div><div class="sub pen">PUNI.<b id="pen1">0</b></div></div></div></section><section class="fighter white"><div class="info"><div class="name" id="name2">ATLETA BRANCO</div><div class="team" id="team2"></div></div><div class="scores"><div class="main-score" id="points2">0</div><div class="subs"><div class="sub adv">VANT.<b id="adv2">0</b></div><div class="sub pen">PUNI.<b id="pen2">0</b></div></div></div></section><div class="footer">FightScore Pro · Jiu-Jitsu Scoreboard</div></main><section class="winner" id="winner"><h1>VENCEDOR</h1><div class="wname" id="winnerName"></div><div class="wteam" id="winnerTeam"></div><div class="method" id="method"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/scoreboard.js"></script><script>
const $=id=>document.getElementById(id);function render(s){const r=FightScore.remaining(s);$('timer').textContent=FightScore.formatTime(r);$('name1').textContent=s.atleta1.nome||'ATLETA AZUL';$('team1').textContent=s.atleta1.equipe||'';$('points1').textContent=s.atleta1.pontos;$('adv1').textContent=s.atleta1.vantagens;$('pen1').textContent=s.atleta1.punicoes;$('name2').textContent=s.atleta2.nome||'ATLETA BRANCO';$('team2').textContent=s.atleta2.equipe||'';$('points2').textContent=s.atleta2.pontos;$('adv2').textContent=s.atleta2.vantagens;$('pen2').textContent=s.atleta2.punicoes;const done=s.lutaFinalizada&&s.nomeVencedor;$('winner').classList.toggle('show',!!done);$('winnerName').textContent=done?s.nomeVencedor:'';$('winnerTeam').textContent=done?(s.equipeVencedor||''):'';$('method').textContent=done?(s.comoTerminou||''):'';}
FightScore.subscribe(render);FightScore.initRealtime('viewer');setInterval(()=>{const s=FightScore.read();$('timer').textContent=FightScore.formatTime(FightScore.remaining(s));},200);
</script></body></html>
