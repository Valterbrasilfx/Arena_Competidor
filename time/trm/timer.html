<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Combate Oficial - Ultra Responsive TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #b9b9b9;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.5vh 4vw 1.5vh 4vw;
            overflow: hidden;
            position: relative;
        }

        
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0a0a0a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .splash-logo {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            animation: introPulse 2.5s ease-in-out forwards;
            filter: drop-shadow(0px 0px 30px rgba(255, 0, 0, 0.4));
        }

        .splash-credits {
            margin-top: 3vh;
            font-size: 2.2vh;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 700;
            opacity: 0;
            animation: fadeInCredits 1.5s ease-in-out 0.8s forwards;
        }

      
        @keyframes introPulse {
            0% { transform: scale(0.7); opacity: 0; filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); }
            35% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0px 0px 40px rgba(255, 0, 13, 0.6)); }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        @keyframes fadeInCredits {
            0% { opacity: 0; transform: translateY(10px); }
            50% { opacity: 1; color: #aaa; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
            100% { opacity: 0; }
        }

        
        header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 40vh; 
            min-height: 140px;
            padding-top: 4vh; 
        }

        .logo-container {
            height: 100%; 
            width: auto;
            max-width: 75%; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            height: 100%; 
            width: auto;   
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 0px 25px rgba(0, 0, 0, 0.2));
        }

        .logo-fallback {
            font-size: 5.5vh;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
        }

        .clock-container {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 15, 15, 0.8);
            padding: 1.2vh 1.8vw;
            border-radius: 6px;
            border: 1px solid #222;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-clock {
            font-size: 3.2vh;
            font-weight: 700;
            font-family: monospace;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1;
        }

        .brand-date {
            font-size: 4.5vh;
            font-weight: 800;
            color: #ffcc00;
            text-transform: lowercase;
            line-height: 1;
        }

        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0; 
            width: 100%;
        }

        .status-banner {
            font-size: 4vh; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.2vw;
            margin-bottom: 0.2vh;
            transition: all 0.3s ease;
        }

        .status-banner.work { color: #ffffff; text-shadow: 0 0 30px rgba(229,9,20,0.5); }
        .status-banner.rest { color: #ffffff; text-shadow: 0 0 30px rgba(0,255,102,0.5); }
        .status-banner.paused { color: #ffffff; text-shadow: 0 0 30px rgba(255,204,0,0.4); }

        .main-timer {
            font-size: 22vh; /* Aumentado levemente aproveitando o espaço útil */
            font-weight: 900;
            font-family: monospace;
            line-height: 0.8;
            color: #ffffff;
            letter-spacing: -0.5vw;
            text-shadow: 0px 15px 50px rgba(0,0,0,0.9);
        }

        .round-display {
            font-size: 4.5vh; 
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 2px;
            margin-top: 0.5vh;
        }

        .round-display span {
            color: #ffffff;
            font-size: 5.5vh; 
            margin-left: 10px;
            line-height: 1;
        }

        /* --- INFERIOR --- */
        footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            border-top: 2px solid #111;
            padding-top: 1.2vh;
            height: 18vh; /* Reduzido ligeiramente a altura da base do painel */
            min-height: 120px;
            position: relative;
        }

        .time-options {
            display: flex;
            gap: 1vw;
            width: 100%;
            max-width: 950px;
            justify-content: center;
        }

        .btn-option {
            flex: 1;
            background-color: #0c0c0c;
            color: #777;
            border: 2px solid #222;
            padding: 1vh 0.5vw;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-option:focus {
            border-color: #000000 !important;
            color: #fff !important;
            background-color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            transform: scale(1.04);
        }

        .btn-option.active {
            background-color: #111;
            border-color: #000000;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(229, 9, 20, 0.2);
        }

        .btn-option:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }

        .action-controls {
            display: flex;
            gap: 1.5vw;
            width: 100%;
            max-width: 950px;
        }

        .btn {
            flex: 2;
            background-color: #111;
            color: #fff;
            border: 2px solid #333;
            padding: 1.2vh 0;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        .btn:focus {
            border-color: #ffffff !important;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .btn-start {
            background-color: #ff000d;
            border-color: #ff000d;
            flex: 3;
        }

        .btn-start:focus {
            border-color: #ffcc00 !important;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.5);
        }

        .btn-pause {
            background-color: #ffcc00;
            border-color: #ffcc00;
            color: #000;
            flex: 3;
        }

        .btn-reset { color: #aaa; }

        /* CRÉDITOS NO RODAPÉ DO PAINEL */
        .arena-footer-text {
            font-size: 1.4vh;
            color: #555;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: lowercase;
            margin-top: 0.3vh;
        }

        @media (max-width: 768px) or (orientation: portrait) {
            .main-timer { font-size: 14vh; }
            .status-banner { font-size: 3.5vh; }
            .round-display { font-size: 4vh; }
            .round-display span { font-size: 5vh; }
            .time-options, .action-controls { max-width: 100%; }
            .clock-container { position: relative; right: auto; top: auto; transform: none; margin-left: 20px; padding: 5px 10px; }
            header { justify-content: space-between; padding: 0 10px; height: 18vh; }
            .logo-container { margin-top: 0; }
            .logo-container img { height: 85%; } 
            .btn { font-size: 1.1rem; padding: 12px 0; }
            .btn-option { font-size: 0.9rem; }
            .brand-date { font-size: 3vh; }
            .brand-clock { font-size: 2.2vh; }
            main { margin: 1vh 0; }
            .splash-logo { max-width: 80%; }
        }
    </style>
</head>
<body>

    <!-- TELA DE INTRODUÇÃO ANTES DE INICIAR O PAINEL -->
    <div id="splash-screen">
        <img class="splash-logo" src="trm.png" alt="TRM Logo" onerror="this.style.display='none';">
        <div class="splash-credits">by arena competidor</div>
    </div>

    <!-- TOPO -->
    <header>
        <div class="logo-container">
            <img src="trm.png" alt="Logo Academia" onerror="this.style.display='none'; document.getElementById('fallback').style.display='block'">
            <div id="fallback" class="logo-fallback" style="display: none;">WA TEAM<br><span style="color:#fff; font-size:2vh; letter-spacing:4px;">COMBAT TEAM</span></div>
        </div>
        <div class="clock-container">
            <div class="brand-clock" id="clock">00:00:00</div>
            <div class="brand-date" id="date">...</div>
        </div>
    </header>

    <!-- ÁREA CENTRAL DO TIMER -->
    <main>
        <div class="status-banner paused" id="status-text">CONFIGURAÇÃO</div>
        <div class="main-timer" id="timer-display">05:00</div>
        <div class="round-display" id="round-display">ROUND <span>1</span></div>
    </main>

    <!-- INFERIOR -->
    <footer>
        <div class="time-options">
            <button class="btn-option" data-seconds="60" tabindex="1">1 Min</button>
            <button class="btn-option" data-seconds="120" tabindex="2">2 Min</button>
            <button class="btn-option" data-seconds="180" tabindex="3">3 Min</button>
            <button class="btn-option" data-seconds="240" tabindex="4">4 Min</button>
            <button class="btn-option active" data-seconds="300" tabindex="5">5 Min</button>
            <button class="btn-option" data-seconds="360" tabindex="6">6 Min</button>
        </div>

        <div class="action-controls">
            <button class="btn btn-start" id="btn-start-pause" tabindex="7">Iniciar</button>
            <button class="btn btn-reset" id="btn-reset" tabindex="8">Resetar</button>
        </div>
        
        <div class="arena-footer-text">by arena competidor</div>
    </footer>

    <!-- AUDIO SINC -->
    <audio id="sound-horn" src="buzina.mp3" preload="auto"></audio>
    <audio id="sound-warning" src="bip.mp3" preload="auto"></audio>

    <script>
        let timerSeconds = 300; 
        let currentRound = 1;
        let isRunning = false;
        let isResting = false;
        let countdownInterval = null;
        let warningPlayed = false;
        let timeOffset = 0; 

        const restDuration = 35; 

        const timerDisplay = document.getElementById('timer-display');
        const statusText = document.getElementById('status-text');
        const roundDisplay = document.getElementById('round-display');
        const clockDisplay = document.getElementById('clock');
        const dateDisplay = document.getElementById('date');
        const btnStartPause = document.getElementById('btn-start-pause');
        const btnReset = document.getElementById('btn-reset');
        const optionButtons = document.querySelectorAll('.btn-option');

        const soundHorn = document.getElementById('sound-horn');
        const soundWarning = document.getElementById('sound-warning');

        soundHorn.volume = 1.0;
        soundWarning.volume = 1.0;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                setTimeout(() => splash.remove(), 800); 
            }, 2600);
        });

        function syncTimeWithInternet() {
            fetch('https://worldtimeapi.org/api/timezone/America/Sao_Paulo')
                .then(response => response.json())
                .then(data => {
                    if(data && data.datetime) {
                        const internetTime = new Date(data.datetime);
                        const localTime = new Date();
                        timeOffset = internetTime.getTime() - localTime.getTime();
                    }
                })
                .catch(error => {
                    console.log("Erro de sincronização, usando hora local:", error);
                });
        }

        function updateClock() {
            const localNow = new Date();
            const now = new Date(localNow.getTime() + timeOffset);
            
            clockDisplay.textContent = String(now.getHours()).padStart(2, '0') + ':' +
                                       String(now.getMinutes()).padStart(2, '0') + ':' +
                                       String(now.getSeconds()).padStart(2, '0');
            
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            let dateStr = now.toLocaleDateString('pt-BR', options);
            dateStr = dateStr.replace('.', '. ');
            dateDisplay.textContent = dateStr;
        }

        syncTimeWithInternet();
        setInterval(syncTimeWithInternet, 900000);
        setInterval(updateClock, 1000);
        updateClock();

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timerSeconds);
            roundDisplay.innerHTML = isResting ? `DESCANSO` : `ROUND <span>${currentRound}</span>`;
            
            if (!isRunning) {
                statusText.textContent = "PAUSADO";
                statusText.className = "status-banner paused";
            } else if (isResting) {
                statusText.textContent = "RECUPERE";
                statusText.className = "status-banner rest";
            } else {
                statusText.textContent = "COMBATE";
                statusText.className = "status-banner work";
            }
        }

        function getSelectedRoundTime() {
            const activeBtn = document.querySelector('.btn-option.active');
            return activeBtn ? parseInt(activeBtn.getAttribute('data-seconds')) : 300;
        }

        function initTimer() {
            if (!isRunning) {
                timerSeconds = getSelectedRoundTime();
                isResting = false;
                currentRound = 1;
                warningPlayed = false;
                updateDisplay();
            }
        }

        function playSound(audioElement) {
            audioElement.currentTime = 0;
            audioElement.volume = 1.0; 
            audioElement.play().catch(e => console.log("Aguardando interação inicial."));
        }

        function tick() {
            if (timerSeconds > 0) {
                timerSeconds--;
                if (!isResting && timerSeconds === 10 && !warningPlayed) {
                    playSound(soundWarning);
                    warningPlayed = true;
                }
            } else {
                playSound(soundHorn);
                warningPlayed = false;

                if (!isResting) {
                    isResting = true;
                    timerSeconds = restDuration;
                } else {
                    isResting = false;
                    currentRound++;
                    timerSeconds = getSelectedRoundTime();
                }
            }
            updateDisplay();
        }

        function toggleButtonsState(disable) {
            optionButtons.forEach(btn => {
                btn.disabled = disable;
                if (disable) {
                    btn.removeAttribute('tabindex');
                } else {
                    const num = btn.getAttribute('data-seconds') / 60;
                    btn.setAttribute('tabindex', num.toString());
                }
            });
        }

        function startPause() {
            soundHorn.volume = 1.0;
            soundWarning.volume = 1.0;
            
            soundHorn.play().then(() => { soundHorn.pause(); }).catch(() => {});
            soundWarning.play().then(() => { soundWarning.pause(); }).catch(() => {});

            if (isRunning) {
                isRunning = false;
                clearInterval(countdownInterval);
                toggleButtonsState(false);
                btnStartPause.textContent = "Iniciar";
                btnStartPause.className = "btn btn-start";
            } else {
                isRunning = true;
                toggleButtonsState(true);
                btnStartPause.textContent = "Pausar";
                btnStartPause.className = "btn btn-pause";
                countdownInterval = setInterval(tick, 1000);
            }
            updateDisplay();
        }

        function reset() {
            isRunning = false;
            clearInterval(countdownInterval);
            toggleButtonsState(false);
            btnStartPause.textContent = "Iniciar";
            btnStartPause.className = "btn btn-start";
            initTimer();
        }

        optionButtons.forEach(button => {
            button.addEventListener('click', function() {
                if (!isRunning) {
                    optionButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    initTimer();
                }
            });
        });

        btnStartPause.addEventListener('click', startPause);
        btnReset.addEventListener('click', reset);

        initTimer();
    </script>
</body>
</html>
