<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Graduação e Convidados | Arena Competidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Bibliotecas para Exportação de Excel e PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb; 
            --accent-green: #22c55e;
            --accent-yellow: #f59e0b;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%; text-align: center; padding: 15px 0;
            background-color: #000; position: fixed; top: 0; z-index: 1000;
        }
        header img { max-width: 250px; width: 80%; height: auto; }

        .main-content {
            margin-top: 140px;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            color: #111827;
            font-weight: 700; font-size: 2rem;
            margin-bottom: 25px;
        }

        /* Painel de Filtros e Ações */
        .controls-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-md);
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .filter-group select, .filter-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--primary-color);
        }

        .actions-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            padding-top: 10px;
            border-top: 1px solid #f3f4f6;
        }

        .btn-action {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-excel {
            background-color: #16a34a;
            color: white;
        }
        .btn-excel:hover { background-color: #15803d; }

        .btn-pdf {
            background-color: #dc2626;
            color: white;
        }
        .btn-pdf:hover { background-color: #b91c1c; }

        .accordion-item {
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid #e5e7eb;
            text-align: left;
        }

        .accordion-header {
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            transition: background 0.2s;
        }

        .accordion-header:hover { background: #f8fafc; }

        .team-info h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            color: var(--primary-color);
            margin: 0;
        }

        .team-info p {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-green);
            margin: 4px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .accordion-header::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .accordion-header.active::after { content: '-'; }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #fff;
        }

        .accordion-content.open {
            max-height: 15000px;
            padding: 0 25px 25px;
            border-top: 1px solid #f3f4f6;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; padding: 12px; 
            font-size: 0.75rem; color: var(--text-secondary); 
            text-transform: uppercase; border-bottom: 2px solid #f3f4f6; 
            white-space: nowrap;
        }
        td { padding: 14px 12px; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; white-space: nowrap; }

        .badge-kimono {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e5e7eb;
            color: #374151;
            text-transform: uppercase;
        }

        /* Badges de Cores das Faixas com Alto Contraste */
        .badge-faixa {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .faixa-preta { background-color: #111827; color: #ffffff; border: 1px solid #374151; }
        .faixa-marrom { background-color: #78350f; color: #ffffff; }
        .faixa-roxa { background-color: #6b21a8; color: #ffffff; }
        .faixa-azul { background-color: #1d4ed8; color: #ffffff; }
        .faixa-verde { background-color: #15803d; color: #ffffff; }
        .faixa-laranja { background-color: #ea580c; color: #ffffff; }
        .faixa-amarela { background-color: #facc15; color: #713f12; }
        .faixa-cinza { background-color: #6b7280; color: #ffffff; }
        .faixa-branca { background-color: #f9fafb; color: #111827; border: 1px solid #d1d5db; }
        .faixa-padrao { background-color: #e5e7eb; color: #374151; }

        .link-voltar {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 30px;
            background-color: #111827;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .link-voltar:hover { background-color: var(--primary-color); transform: translateY(-2px); }

        #loading-message { padding: 50px; font-weight: 600; color: var(--primary-color); }

        @media (max-width: 900px) {
            .main-content { margin-top: 110px; }
            thead { display: none; }
            tr { display: block; border-bottom: 2px solid #f3f4f6; padding: 10px 0; }
            td { 
                display: flex; 
                justify-content: space-between; 
                border: none; 
                padding: 6px 0; 
                white-space: normal;
                text-align: right;
            }
            td::before { 
                content: attr(data-label); 
                font-weight: 700; 
                color: var(--text-secondary); 
                font-size: 0.75rem; 
                text-align: left; 
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html"><img src="../../img/arena2.png" alt="Arena Competidor Logo"></a>
    </header>

    <div class="main-content">
        <h1>Lista de Inscrições e Graduação</h1>

        <!-- Controles de Filtro e Download -->
        <div class="controls-panel">
            <div class="filters-grid">
                <div class="filter-group">
                    <label>Filtrar por Faixa</label>
                    <select id="filterFaixa" onchange="applyFilters()">
                        <option value="">Todas as Faixas</option>
                        <option value="PRETA">Preta</option>
                        <option value="MARROM">Marrom</option>
                        <option value="ROXA">Roxa</option>
                        <option value="AZUL">Azul</option>
                        <option value="VERDE">Verde</option>
                        <option value="LARANJA">Laranja</option>
                        <option value="AMARELA">Amarela</option>
                        <option value="CINZA">Cinza</option>
                        <option value="BRANCA">Branca</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Filtrar por Graus</label>
                    <select id="filterGraus" onchange="applyFilters()">
                        <option value="">Todos os Graus</option>
                        <option value="4">4 Graus</option>
                        <option value="3">3 Graus</option>
                        <option value="2">2 Graus</option>
                        <option value="1">1 Grau</option>
                        <option value="0">0 Graus</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Tempo de Jiu Jitsu</label>
                    <input type="text" id="filterTempo" placeholder="Ex: 2 anos..." oninput="applyFilters()">
                </div>
            </div>
            <div class="actions-group">
                <button class="btn-action btn-excel" onclick="exportToExcel()">📊 Baixar Excel</button>
                <button class="btn-action btn-pdf" onclick="exportToPDF()">📄 Baixar PDF</button>
            </div>
        </div>

        <div id="loading-message">Sincronizando banco de dados...</div>
        <div id="listaInscritos"></div>
        <a href="https://arenacompetidor.com" class="link-voltar">Voltar para o Arena</a>
    </div>

    <script>
        const EXEC_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVH_DfCKGmD5HExS2P_0pPIA-zcoMSJ54a-wKm1CFIB2cvT0bPtHJpWjcqOaajawDz8bfPFdJpKOur/pub?output=csv';

        // Ordem de faixas configurada
        const FAIXA_ORDER = ['PRETA', 'MARROM', 'ROXA', 'AZUL', 'VERDE', 'LARANJA', 'AMARELA', 'CINZA', 'BRANCA'];

        // Definição de cores Hex e RGB para PDF e Excel
        const FAIXA_COLORS = {
            'PRETA':   { bg: '#111827', text: '#ffffff', rgbBg: [17, 24, 39],   rgbText: [255, 255, 255] },
            'MARROM':  { bg: '#78350f', text: '#ffffff', rgbBg: [120, 53, 15],  rgbText: [255, 255, 255] },
            'ROXA':    { bg: '#6b21a8', text: '#ffffff', rgbBg: [107, 33, 168], rgbText: [255, 255, 255] },
            'AZUL':    { bg: '#1d4ed8', text: '#ffffff', rgbBg: [29, 78, 216],  rgbText: [255, 255, 255] },
            'VERDE':   { bg: '#15803d', text: '#ffffff', rgbBg: [21, 128, 61],  rgbText: [255, 255, 255] },
            'LARANJA': { bg: '#ea580c', text: '#ffffff', rgbBg: [234, 88, 12],  rgbText: [255, 255, 255] },
            'AMARELA': { bg: '#facc15', text: '#713f12', rgbBg: [250, 204, 21], rgbText: [113, 63, 18] },
            'CINZA':   { bg: '#6b7280', text: '#ffffff', rgbBg: [107, 114, 128],rgbText: [255, 255, 255] },
            'BRANCA':  { bg: '#f9fafb', text: '#111827', rgbBg: [249, 250, 251],rgbText: [17, 24, 39] }
        };

        let allData = [];
        let filteredData = [];

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Função para obter dados de estilo da faixa
        function getFaixaColorInfo(faixaStr) {
            const f = (faixaStr || '').toUpperCase();
            for (let key of FAIXA_ORDER) {
                if (f.includes(key)) return FAIXA_COLORS[key];
            }
            return { bg: '#e5e7eb', text: '#374151', rgbBg: [229, 231, 235], rgbText: [55, 65, 81] };
        }

        function getFaixaBadgeClass(faixaStr) {
            const f = (faixaStr || '').toUpperCase();
            if (f.includes('PRETA')) return 'faixa-preta';
            if (f.includes('MARROM')) return 'faixa-marrom';
            if (f.includes('ROXA')) return 'faixa-roxa';
            if (f.includes('AZUL')) return 'faixa-azul';
            if (f.includes('VERDE')) return 'faixa-verde';
            if (f.includes('LARANJA')) return 'faixa-laranja';
            if (f.includes('AMARELA')) return 'faixa-amarela';
            if (f.includes('CINZA')) return 'faixa-cinza';
            if (f.includes('BRANCA')) return 'faixa-branca';
            return 'faixa-padrao';
        }

        // Função de Ordenação por Hierarquia
        function sortAtletas(list) {
            return list.sort((a, b) => {
                const getFaixaIndex = (f) => {
                    const upper = (f || '').toUpperCase();
                    const index = FAIXA_ORDER.findIndex(order => upper.includes(order));
                    return index === -1 ? 99 : index;
                };

                const faixaA = getFaixaIndex(a.faixa);
                const faixaB = getFaixaIndex(b.faixa);

                if (faixaA !== faixaB) {
                    return faixaA - faixaB;
                }

                const grauA = parseInt(a.graus) || 0;
                const grauB = parseInt(b.graus) || 0;

                return grauB - grauA; // Decrescente: 4, 3, 2, 1, 0
            });
        }

        async function fetchAndProcessData() {
            const loadingEl = document.getElementById('loading-message');
            try {
                const response = await fetch(EXEC_URL, { redirect: 'follow' });
                const textData = await response.text();

                let records = [];

                if (textData.trim().startsWith('[') || textData.trim().startsWith('{')) {
                    const parsed = JSON.parse(textData);
                    records = Array.isArray(parsed) ? parsed : (parsed.data || []);
                } else {
                    const lines = textData.split(/\r?\n/).filter(l => l.trim() !== '');
                    if (lines.length > 1) {
                        const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').toUpperCase());
                        
                        records = lines.slice(1).map(line => {
                            const cols = parseCSVLine(line).map(c => c.replace(/^"|"$/g, ''));
                            let obj = {};
                            headers.forEach((h, i) => {
                                obj[h] = cols[i] || '';
                            });
                            return obj;
                        });
                    }
                }

                if (records.length === 0) {
                    renderEmptyState('Nenhum registro encontrado na planilha.');
                    return;
                }

                allData = records.map(row => {
                    const getVal = (possibleKeys) => {
                        const keys = Object.keys(row);
                        const match = keys.find(k => possibleKeys.some(pk => k.toUpperCase().includes(pk)));
                        return match ? row[match] : '-';
                    };

                    return {
                        timestamp: getVal(['TIMESTAMP', 'DATA']),
                        nome: getVal(['NOME COMPLETO', 'NOME']),
                        faixa: getVal(['FAIXA ATUAL', 'FAIXA']),
                        graus: getVal(['GRAUS']),
                        ultimaGraduacao: getVal(['QUANDO FOI MINHA ULTIMA', 'GRADUAÇÃO', 'GRADUACAO']),
                        tempoJiuJitsu: getVal(['QUANTO TEMPO DE JIU JITSU', 'TEMPO DE JIU']),
                        vaiConvidado: getVal(['VAI LEVAR CONVIDADO']),
                        qtdConvidados: getVal(['QUANTOS CONVIDADOS']),
                        corKimono: getVal(['COR DO KIMONO', 'KIMONO'])
                    };
                });

                allData = sortAtletas(allData);
                filteredData = [...allData];
                renderTable(filteredData);

            } catch (err) {
                console.error('Erro na leitura:', err);
                loadingEl.innerHTML = `
                    <p style="color: #ef4444; margin-bottom: 10px;">❌ Não foi possível carregar os dados.</p>
                `;
            }
        }

        function applyFilters() {
            const fFaixa = document.getElementById('filterFaixa').value.toUpperCase();
            const fGraus = document.getElementById('filterGraus').value;
            const fTempo = document.getElementById('filterTempo').value.toLowerCase().trim();

            filteredData = allData.filter(item => {
                const matchFaixa = !fFaixa || item.faixa.toUpperCase().includes(fFaixa);
                const matchGraus = !fGraus || (parseInt(item.graus) || 0).toString() === fGraus;
                const matchTempo = !fTempo || item.tempoJiuJitsu.toLowerCase().includes(fTempo);
                return matchFaixa && matchGraus && matchTempo;
            });

            renderTable(filteredData);
        }

        function renderEmptyState(msg) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('listaInscritos').innerHTML = `<div style="padding: 30px; font-weight:600; color: var(--text-secondary);">${msg}</div>`;
        }

        function renderTable(data) {
            document.getElementById('loading-message').style.display = 'none';
            const container = document.getElementById('listaInscritos');
            container.innerHTML = '';

            if (data.length === 0) {
                renderEmptyState('Nenhum atleta corresponde aos filtros aplicados.');
                return;
            }

            const item = document.createElement('div');
            item.className = 'accordion-item';

            const tableRows = data.map((atleta, index) => `
                <tr>
                    <td data-label="Nº">${index + 1}</td>
                    <td data-label="Nome Completo"><strong>${atleta.nome}</strong></td>
                    <td data-label="Faixa Atual"><span class="badge-faixa ${getFaixaBadgeClass(atleta.faixa)}">${atleta.faixa}</span></td>
                    <td data-label="Graus">${atleta.graus}</td>
                    <td data-label="Última Graduação">${atleta.ultimaGraduacao}</td>
                    <td data-label="Tempo de JJ">${atleta.tempoJiuJitsu}</td>
                    <td data-label="Levar Convidado?">${atleta.vaiConvidado}</td>
                    <td data-label="Qtd. Convidados">${atleta.qtdConvidados}</td>
                    <td data-label="Cor do Kimono"><span class="badge-kimono">${atleta.corKimono}</span></td>
                </tr>
            `).join('');

            item.innerHTML = `
                <div class="accordion-header active" onclick="toggleAcc(this)">
                    <div class="team-info">
                        <h2>Inscrições Confirmadas</h2>
                        <p>${data.length} Atleta(s) Exibido(s)</p>
                    </div>
                </div>
                <div class="accordion-content open">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Nome Completo</th>
                                    <th>Faixa</th>
                                    <th>Graus</th>
                                    <th>Últ. Graduação</th>
                                    <th>Tempo de JJ</th>
                                    <th>Convidado?</th>
                                    <th>Qtd. Conv.</th>
                                    <th>Kimono</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            container.appendChild(item);
        }

        function toggleAcc(el) {
            const content = el.nextElementSibling;
            el.classList.toggle('active');
            content.classList.toggle('open');
        }

        // Exportação para Excel preservando cores de fundo e texto na coluna Faixa
        function exportToExcel() {
            if (filteredData.length === 0) return alert('Nenhum dado para exportar!');

            let tableHtml = `
                <table border="1">
                    <thead>
                        <tr style="background-color: #2563eb; color: #ffffff; font-weight: bold;">
                            <th>Nº</th>
                            <th>Nome Completo</th>
                            <th>Faixa Atual</th>
                            <th>Graus</th>
                            <th>Última Graduação</th>
                            <th>Tempo de Jiu Jitsu</th>
                            <th>Vai Levar Convidado</th>
                            <th>Qtd. Convidados</th>
                            <th>Cor do Kimono</th>
                            <th>Próximo Grau/Próxima Faixa</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredData.forEach((item, index) => {
                const colorInfo = getFaixaColorInfo(item.faixa);
                tableHtml += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.nome}</td>
                        <td style="background-color: ${colorInfo.bg}; color: ${colorInfo.text}; font-weight: bold; text-align: center;">${item.faixa}</td>
                        <td>${item.graus}</td>
                        <td>${item.ultimaGraduacao}</td>
                        <td>${item.tempoJiuJitsu}</td>
                        <td>${item.vaiConvidado}</td>
                        <td>${item.qtdConvidados}</td>
                        <td>${item.corKimono}</td>
                        <td></td>
                    </tr>
                `;
            });

            tableHtml += `</tbody></table>`;

            const blob = new Blob(['\ufeff' + tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Graduacao_JiuJitsu.xls';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Exportação para PDF estilizando a célula da Faixa com suas cores reais
        function exportToPDF() {
            if (filteredData.length === 0) return alert('Nenhum dado para exportar!');

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });

            doc.text("Relatório de Graduação e Inscrições", 14, 15);

            const headers = [["#", "Nome Completo", "Faixa", "Graus", "Últ. Grad.", "Tempo JJ", "Conv.?", "Qtd", "Kimono", "Próximo Grau/Próxima Faixa"]];
            
            const rows = filteredData.map((item, index) => [
                index + 1,
                item.nome,
                item.faixa,
                item.graus,
                item.ultimaGraduacao,
                item.tempoJiuJitsu,
                item.vaiConvidado,
                item.qtdConvidados,
                item.corKimono,
                "" // Coluna em branco para preenchimento posterior
            ]);

            doc.autoTable({
                head: headers,
                body: rows,
                startY: 22,
                styles: { fontSize: 8 },
                headStyles: { fillColor: [37, 99, 235] },
                didParseCell: function(data) {
                    // Pinta e estiliza a coluna de Faixa (índice 2) nas linhas do corpo da tabela
                    if (data.section === 'body' && data.column.index === 2) {
                        const faixaTexto = data.cell.raw;
                        const colorInfo = getFaixaColorInfo(faixaTexto);

                        data.cell.styles.fillColor = colorInfo.rgbBg;
                        data.cell.styles.textColor = colorInfo.rgbText;
                        data.cell.styles.fontStyle = 'bold';
                        data.cell.styles.halign = 'center';
                    }
                }
            });

            doc.save("Graduacao_JiuJitsu.pdf");
        }

        fetchAndProcessData();
    </script>
</body>
</html>
